# Kamal 2 deploy config. See docs/deploy.md.
# Host and SSH user come from the environment (GitHub repo variables in CI).
service: tg-mcp
image: qelphybox/tg-mcp

servers:
  web:
    hosts:
      - <%= ENV.fetch("KAMAL_HOST") %>

ssh:
  user: <%= ENV.fetch("KAMAL_SSH_USER", "deploy") %>

registry:
  server: ghcr.io
  username: qelphybox
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

proxy:
  host: tgmcp.qelphybox.space
  # forward_headers stays unset (false with ssl): kamal-proxy drops any client-sent
  # X-Forwarded-For and sets it to the TCP peer it saw, which the app trusts
  # (TG_MCP_TRUST_FORWARDED_FOR). With forward_headers: true it would append that
  # address instead, so the right-most entry the app reads is the same either way.
  ssl: true
  app_port: 8080
  healthcheck:
    path: /healthz
    interval: 2
    timeout: 3
  # Only bounds the wait for response headers. MCP streams are text/event-stream,
  # which kamal-proxy switches to unbuffered pass-through on its own.
  response_timeout: 30
  # Media links (#36) stream files of up to 20 MB from Telegram: pass responses
  # through as they come. Buffered, kamal-proxy would hold each one whole and
  # write anything over 1 MB to disk. Requests stay buffered (the default).
  buffering:
    requests: true
    responses: false

env:
  clear:
    TG_MCP_PUBLIC_URL: https://tgmcp.qelphybox.space
    TG_MCP_BIND: 0.0.0.0:8080
    TG_MCP_DB_PATH: /data/tg-mcp.db
    # kamal-proxy is the only way in; client IPs (for rate limits) come from its XFF.
    TG_MCP_TRUST_FORWARDED_FOR: "1"
    # EXPERIMENTAL (#58 prototype): get_media mode `document`, tried from claude.ai
    # (docs/acceptance.md §22). Off by default for self-hosters.
    TG_MCP_EXPERIMENTAL_DOCUMENTS: "1"
    RUST_LOG: info
  secret:
    - TG_MCP_API_ID
    - TG_MCP_API_HASH

volumes:
  - tg-mcp-data:/data

# Old container gets this long to finish in-flight requests before SIGTERM.
drain_timeout: 30
# Then this long to exit after SIGTERM before SIGKILL (Docker's default is 10 s
# for proxied roles); shutdown re-seals changed Telegram sessions in this window.
stop_timeout: 30

logging:
  options:
    max-size: 20m
    max-file: "5"
