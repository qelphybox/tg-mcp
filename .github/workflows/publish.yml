name: Publish

# Every push to main: build linux/amd64 and linux/arm64 once and push
# ghcr.io/qelphybox/tg-mcp:<full sha> and :edge (#131), one digest for both.
# `latest` and the semver tags move only on releases (release.yml). The push
# uses this job's own short-lived GITHUB_TOKEN; there is no long-lived registry
# token anywhere. Forks skip the job and stay green.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-edge
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/qelphybox/tg-mcp
  # Same as release.yml's.
  DESCRIPTION: "Unofficial Telegram MCP server: read, search, sum up chats; draft and send where you allow."

jobs:
  # The deploy waits for this job (#105): keep its id and name.
  edge:
    name: edge
    if: github.repository == 'qelphybox/tg-mcp'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      # ADR-0007: official images carry the Built-in app when its secrets exist.
      - id: builtin
        env:
          BUILTIN_API_ID: ${{ secrets.TG_MCP_BUILTIN_API_ID }}
          BUILTIN_API_HASH: ${{ secrets.TG_MCP_BUILTIN_API_HASH }}
        run: |
          if [ -n "$BUILTIN_API_ID" ] && [ -n "$BUILTIN_API_HASH" ]; then
            echo "mode=required" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TG_MCP_BUILTIN_API_ID / TG_MCP_BUILTIN_API_HASH are not set: this edge image has no Built-in app"
            echo "mode=optional" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=edge,branch=main
          labels: |
            org.opencontainers.image.title=tg-mcp
            org.opencontainers.image.description=${{ env.DESCRIPTION }}
            org.opencontainers.image.licenses=MIT

      # The Dockerfile cross-compiles from the runner's own platform, so arm64
      # needs no emulation.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            tg_builtin_api_id=${{ secrets.TG_MCP_BUILTIN_API_ID }}
            tg_builtin_api_hash=${{ secrets.TG_MCP_BUILTIN_API_HASH }}
          build-args: TG_MCP_BUILTIN_APP=${{ steps.builtin.outputs.mode }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish

      - name: Published
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "$IMAGE:$GITHUB_SHA and $IMAGE:edge = $DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA"
