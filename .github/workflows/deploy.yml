name: Deploy

# Production runs the image Publish pushed for this commit (#105):
# ghcr.io/qelphybox/tg-mcp:<sha>, by digest. Kamal builds nothing and pushes
# nothing (`--skip-push`), so `latest` moves only on releases. A push to main
# runs this from publish.yml once its `edge` job is green; a manual run deploys
# main's head, or an earlier published <sha> (a rollback).

on:
  workflow_call:
    inputs:
      command:
        type: string
        default: deploy
      version:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      command:
        description: "deploy = normal rollout; setup = first run on a fresh server (installs Docker, boots kamal-proxy)"
        type: choice
        options: [deploy, setup]
        default: deploy
      version:
        description: "Full commit sha of a published image to deploy (empty = the head of the chosen branch)"
        type: string
        default: ""

# Read-only: the job's GITHUB_TOKEN is the server's registry login, and it can't push.
permissions:
  contents: read
  packages: read

jobs:
  deploy:
    # Pushes skip quietly until scripts/setup-deploy.sh has configured a server;
    # a manual run always goes ahead (and fails loudly if it's not set up).
    if: github.event_name == 'workflow_dispatch' || vars.KAMAL_HOST != ''
    runs-on: ubuntu-latest
    # One rollout at a time; a newer one waits instead of racing the older one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://connector.tgmcp.dev
    # -eo pipefail: a failed `imagetools inspect` must fail its step, not hide behind `tr`.
    defaults:
      run:
        shell: bash
    env:
      IMAGE: ghcr.io/qelphybox/tg-mcp
      COMMAND: ${{ inputs.command || 'deploy' }}
      VERSION: ${{ inputs.version || github.sha }}
      KAMAL_HOST: ${{ vars.KAMAL_HOST }}
      KAMAL_SSH_USER: ${{ vars.KAMAL_SSH_USER }}
      # Kamal 2 always runs `docker login` on the server before it pulls. This
      # token has `packages: read` only and expires when the job ends.
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      TG_MCP_API_ID: ${{ secrets.TG_MCP_API_ID }}
      TG_MCP_API_HASH: ${{ secrets.TG_MCP_API_HASH }}
    steps:
      - uses: actions/checkout@v4

      - name: The image of ${{ env.VERSION }} is published
        id: published
        run: |
          [[ "$VERSION" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::version must be a full commit sha, got: $VERSION" >&2; exit 1; }
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')" || {
            echo "::error::$IMAGE:$VERSION is not published: wait for (or re-run) that commit's Publish run" >&2; exit 1; }
          [[ "$digest" == sha256:* ]] || { echo "::error::no digest for $IMAGE:$VERSION (got '$digest')" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Deploying $IMAGE:$VERSION = $digest" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - run: gem install kamal -v 2.12.0 --no-document

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Pinned once by scripts/setup-deploy.sh; never keyscanned here (that would trust any MITM).
      - name: Pin the server's SSH host key
        env:
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KNOWN_HOSTS" || { echo "repo variable SSH_KNOWN_HOSTS is empty; run scripts/setup-deploy.sh" >&2; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts

      # --skip-push: pull the published image on the server instead of building one.
      - name: kamal ${{ env.COMMAND }} --skip-push --version ${{ env.VERSION }}
        run: kamal "$COMMAND" --skip-push --version "$VERSION"

      - name: The server runs the published digest
        env:
          DIGEST: ${{ steps.published.outputs.digest }}
        run: |
          [[ "$DIGEST" == sha256:* ]] || { echo "::error::no published digest to compare with" >&2; exit 1; }
          out="$(kamal server exec "docker image inspect -f '{{range .RepoDigests}}{{println .}}{{end}}' $IMAGE:$VERSION")"
          printf '%s\n' "$out"
          grep -qF "$IMAGE@$DIGEST" <<<"$out" || { echo "::error::the server's $IMAGE:$VERSION is not $DIGEST" >&2; exit 1; }
          echo "The server runs $IMAGE@$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            curl -fsS https://connector.tgmcp.dev/healthz && exit 0
            sleep 2
          done
          echo "healthz did not answer over HTTPS" >&2
          exit 1
