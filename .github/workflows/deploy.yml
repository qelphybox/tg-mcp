name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      command:
        description: "deploy = normal rollout; setup = first run on a fresh server (installs Docker, boots kamal-proxy)"
        type: choice
        options: [deploy, setup]
        default: deploy

# One rollout at a time; a newer push waits instead of racing the older one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    # Pushes skip quietly until scripts/setup-deploy.sh has configured a server;
    # a manual run always goes ahead (and fails loudly if it's not set up).
    if: github.event_name == 'workflow_dispatch' || vars.KAMAL_HOST != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://connector.tgmcp.dev
    env:
      KAMAL_HOST: ${{ vars.KAMAL_HOST }}
      KAMAL_SSH_USER: ${{ vars.KAMAL_SSH_USER }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      TG_MCP_API_ID: ${{ secrets.TG_MCP_API_ID }}
      TG_MCP_API_HASH: ${{ secrets.TG_MCP_API_HASH }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - run: gem install kamal -v 2.12.0 --no-document

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Pinned once by scripts/setup-deploy.sh; never keyscanned here (that would trust any MITM).
      - name: Pin the server's SSH host key
        env:
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KNOWN_HOSTS" || { echo "repo variable SSH_KNOWN_HOSTS is empty; run scripts/setup-deploy.sh" >&2; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts

      - uses: docker/setup-buildx-action@v3

      - name: kamal ${{ inputs.command || 'deploy' }}
        run: kamal ${{ inputs.command || 'deploy' }}

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            curl -fsS https://connector.tgmcp.dev/healthz && exit 0
            sleep 2
          done
          echo "healthz did not answer over HTTPS" >&2
          exit 1
