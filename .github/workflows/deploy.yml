name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      command:
        description: "deploy = normal rollout; setup = first run on a fresh server (installs Docker, boots kamal-proxy)"
        type: choice
        options: [deploy, setup]
        default: deploy

# One rollout at a time; a newer push waits instead of racing the older one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    # Pushes skip quietly until scripts/setup-deploy.sh has configured a server;
    # a manual run always goes ahead (and fails loudly if it's not set up).
    if: github.event_name == 'workflow_dispatch' || vars.KAMAL_HOST != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://connector.tgmcp.dev
    env:
      KAMAL_HOST: ${{ vars.KAMAL_HOST }}
      KAMAL_SSH_USER: ${{ vars.KAMAL_SSH_USER }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      TG_MCP_API_ID: ${{ secrets.TG_MCP_API_ID }}
      TG_MCP_API_HASH: ${{ secrets.TG_MCP_API_HASH }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - run: gem install kamal -v 2.12.0 --no-document

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Pinned once by scripts/setup-deploy.sh; never keyscanned here (that would trust any MITM).
      - name: Pin the server's SSH host key
        env:
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KNOWN_HOSTS" || { echo "repo variable SSH_KNOWN_HOSTS is empty; run scripts/setup-deploy.sh" >&2; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts

      - uses: docker/setup-buildx-action@v3

      - name: kamal ${{ inputs.command || 'deploy' }}
        run: kamal ${{ inputs.command || 'deploy' }}

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            curl -fsS https://connector.tgmcp.dev/healthz && exit 0
            sleep 2
          done
          echo "healthz did not answer over HTTPS" >&2
          exit 1

  # The deployed server end to end on the Test account (ADR-0009): login,
  # Consent, a Draft and a message in A, revoke. A failure is the alert;
  # nothing rolls back on its own (rolling back is a human step:
  # docs/deploy.md). Runs once scripts/accept-setup.sh has set up the
  # acceptance environment and the repository variable ACCEPTANCE_SMOKE=on.
  acceptance-smoke:
    needs: deploy
    if: vars.ACCEPTANCE_SMOKE == 'on' && (github.event_name == 'push' || inputs.command == 'deploy')
    runs-on: ubuntu-latest
    environment: acceptance
    concurrency:
      group: acceptance
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
      TG_ACCEPT_API_ID: ${{ secrets.TG_ACCEPT_API_ID }}
      TG_ACCEPT_API_HASH: ${{ secrets.TG_ACCEPT_API_HASH }}
      TG_ACCEPT_ACCOUNT_ID: ${{ secrets.TG_ACCEPT_ACCOUNT_ID }}
      TG_ACCEPT_PEER_ID: ${{ secrets.TG_ACCEPT_PEER_ID }}
      TG_ACCEPT_CLOUD_PASSWORD: ${{ secrets.TG_ACCEPT_CLOUD_PASSWORD }}
      TG_ACCEPT_DRIVER_SESSION: ${{ secrets.TG_ACCEPT_DRIVER_SESSION }}
      TG_ACCEPT_PEER_SESSION: ${{ secrets.TG_ACCEPT_PEER_SESSION }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo accept smoke against production
        run: |
          set +e
          cargo accept --target https://connector.tgmcp.dev smoke > report.md
          status=$?
          set -e
          {
            if [ "$status" = 3 ]; then
              echo "# BLOCKED: Telegram limited the Test account. The deploy may be fine: run the smoke again after the wait."
              echo
            fi
            cat report.md
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
