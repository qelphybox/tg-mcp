name: Release

# Push a tag like v0.1.0 to publish qelphybox/tg-mcp:{0.1.0,0.1,latest} on
# Docker Hub and the same tags (same build, same digest) on the GHCR mirror,
# for linux/amd64 and linux/arm64, sync the Docker Hub description from the
# README, and create a GitHub Release with generated notes. Without the
# DOCKERHUB_USERNAME variable (forks) the Docker Hub steps are skipped.
# Production deploys are separate (push to main, see deploy.yml).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

env:
  DOCKERHUB_IMAGE: qelphybox/tg-mcp
  # The image's label; Docker Hub's short description is the same text, set by hand.
  DESCRIPTION: "Unofficial Telegram MCP server: read, search, sum up chats; draft and send where you allow."

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches Cargo.toml version
        run: |
          crate="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          test "v$crate" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate" >&2; exit 1; }
          # server.json is what the MCP Registry lists; it must name the same release.
          listed="$(python3 -c 'import json; print(json.load(open("server.json"))["version"])')"
          test "$listed" = "$crate" || {
            echo "server.json version $listed does not match Cargo.toml version $crate" >&2; exit 1; }

      # ADR-0007: an official image never ships without the Built-in app.
      - name: Built-in Telegram app secrets are set
        env:
          BUILTIN_API_ID: ${{ secrets.TG_MCP_BUILTIN_API_ID }}
          BUILTIN_API_HASH: ${{ secrets.TG_MCP_BUILTIN_API_HASH }}
        run: |
          test -n "$BUILTIN_API_ID" && test -n "$BUILTIN_API_HASH" || {
            echo "::error::Repository secrets TG_MCP_BUILTIN_API_ID and TG_MCP_BUILTIN_API_HASH must be set: the Built-in Telegram app of official images (ADR-0007, docs/deploy.md). Add them, then re-run this workflow." >&2
            exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is used when the DOCKERHUB_USERNAME variable and the
      # DOCKERHUB_TOKEN secret are both set; otherwise only GHCR (forks).
      - id: dockerhub
        env:
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DESCRIPTION_TOKEN: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
        run: |
          if [ -n "$USERNAME" ] && [ -n "$TOKEN" ]; then echo "push=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set: publishing to GHCR only"; echo "push=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$USERNAME" ] && [ -n "$DESCRIPTION_TOKEN" ]; then echo "describe=true" >> "$GITHUB_OUTPUT"
          else echo "describe=false" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/login-action@v3
        if: steps.dockerhub.outputs.push == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            name=docker.io/${{ env.DOCKERHUB_IMAGE }},enable=${{ steps.dockerhub.outputs.push == 'true' }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=tg-mcp
            org.opencontainers.image.description=${{ env.DESCRIPTION }}
            org.opencontainers.image.licenses=MIT

      # The Dockerfile cross-compiles from the runner's own platform, so arm64
      # needs no emulation.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Secrets, not build args: they stay out of `docker history` and provenance.
          secrets: |
            tg_builtin_api_id=${{ secrets.TG_MCP_BUILTIN_API_ID }}
            tg_builtin_api_hash=${{ secrets.TG_MCP_BUILTIN_API_HASH }}
          build-args: TG_MCP_BUILTIN_APP=required
          # Secrets aren't part of the cache key: rebuild the build stage so
          # rotated Built-in app secrets always reach the release.
          no-cache-filters: build
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Docker Hub's API needs a token with Delete access to change the
      # description, so it is a separate, optional secret; DOCKERHUB_TOKEN
      # (Read & Write) only pushes.
      - name: Docker Hub description from the README
        if: steps.dockerhub.outputs.describe == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          readme-filepath: README.md
          enable-url-completion: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Image: `${{ env.DOCKERHUB_IMAGE }}:${{ steps.meta.outputs.version }}` on Docker Hub, mirrored as `ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}` through the 0.3.x releases (linux/amd64, linux/arm64, same digest).
            Self-hosting: see the README. What changed: see CHANGELOG.md.
