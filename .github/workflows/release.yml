name: Release

# Push a tag like v0.1.0 to publish ghcr.io/qelphybox/tg-mcp:{0.1.0,0.1,latest}
# (one build, one digest) for linux/amd64 and linux/arm64, and create a GitHub
# Release with generated notes. GHCR is the image's only home (#131); the push
# uses the job's own GITHUB_TOKEN. Production deploys are separate (push to
# main: publish.yml, deploy.yml).

on:
  push:
    tags: ["v*.*.*"]
  # Point `latest` and `X.Y` at an already published X.Y.Z (a restore or a
  # rollback), without a rebuild: the same digest, both architectures (#105).
  workflow_dispatch:
    inputs:
      version:
        description: "An existing release, X.Y.Z (no v): latest and X.Y will point at its digest"
        type: string
        required: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/qelphybox/tg-mcp
  # Same as publish.yml's.
  DESCRIPTION: "Unofficial Telegram MCP server: read, search, sum up chats; draft and send where you allow."

jobs:
  image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches Cargo.toml version
        run: |
          crate="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          test "v$crate" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate" >&2; exit 1; }
          # server.json is what the MCP Registry lists; it must name the same release.
          listed="$(python3 -c 'import json; print(json.load(open("server.json"))["version"])')"
          test "$listed" = "$crate" || {
            echo "server.json version $listed does not match Cargo.toml version $crate" >&2; exit 1; }

      # ADR-0007: an official image never ships without the Built-in app.
      - name: Built-in Telegram app secrets are set
        env:
          BUILTIN_API_ID: ${{ secrets.TG_MCP_BUILTIN_API_ID }}
          BUILTIN_API_HASH: ${{ secrets.TG_MCP_BUILTIN_API_HASH }}
        run: |
          test -n "$BUILTIN_API_ID" && test -n "$BUILTIN_API_HASH" || {
            echo "::error::Repository secrets TG_MCP_BUILTIN_API_ID and TG_MCP_BUILTIN_API_HASH must be set: the Built-in Telegram app of official images (ADR-0007, docs/deploy.md). Add them, then re-run this workflow." >&2
            exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=tg-mcp
            org.opencontainers.image.description=${{ env.DESCRIPTION }}
            org.opencontainers.image.licenses=MIT

      # The Dockerfile cross-compiles from the runner's own platform, so arm64
      # needs no emulation.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Secrets, not build args: they stay out of `docker history` and provenance.
          secrets: |
            tg_builtin_api_id=${{ secrets.TG_MCP_BUILTIN_API_ID }}
            tg_builtin_api_hash=${{ secrets.TG_MCP_BUILTIN_API_HASH }}
          build-args: TG_MCP_BUILTIN_APP=required
          # Secrets aren't part of the cache key: rebuild the build stage so
          # rotated Built-in app secrets always reach the release.
          no-cache-filters: build
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Image: `${{ env.IMAGE }}:${{ steps.meta.outputs.version }}` for linux/amd64 and linux/arm64, the same digest as this release's `X.Y` tag and `latest`.
            Self-hosting: see the README. What changed: see CHANGELOG.md.

  latest:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: The version is a published release
        id: source
        run: |
          [[ "$VERSION" =~ ^([0-9]+\.[0-9]+)\.[0-9]+$ ]] || { echo "::error::version must be X.Y.Z, got: $VERSION" >&2; exit 1; }
          echo "minor=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')" || {
            echo "::error::$IMAGE:$VERSION is not published" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # By digest: copies the existing index (both architectures, attestations)
      # to the new tags; nothing is rebuilt.
      - name: latest and X.Y → ${{ inputs.version }}
        env:
          MINOR: ${{ steps.source.outputs.minor }}
          DIGEST: ${{ steps.source.outputs.digest }}
        run: |
          docker buildx imagetools create -t "$IMAGE:latest" -t "$IMAGE:$MINOR" "$IMAGE@$DIGEST"
          for t in "$VERSION" "$MINOR" latest; do
            got="$(docker buildx imagetools inspect "$IMAGE:$t" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            echo "$IMAGE:$t = $got" | tee -a "$GITHUB_STEP_SUMMARY"
            test "$got" = "$DIGEST" || { echo "::error::$IMAGE:$t is $got, expected $DIGEST" >&2; exit 1; }
          done
          docker buildx imagetools inspect "$IMAGE:latest" | grep Platform | tee -a "$GITHUB_STEP_SUMMARY"
