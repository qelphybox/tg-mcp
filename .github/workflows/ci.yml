name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # release.yml syncs the README to Docker Hub, whose full description takes
      # at most 25,000 bytes.
      - name: README fits Docker Hub's description
        run: |
          size="$(wc -c < README.md)"
          test "$size" -le 25000 || {
            echo "::error::README.md is $size bytes; Docker Hub's full description takes at most 25000" >&2; exit 1; }

  # The image a self-hoster pulls, run the way they would (#101):
  # scripts/container-smoke-test.sh. No secrets, so forks run it too.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tg-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/container-smoke-test.sh tg-mcp:ci

  # arm64 is cross-compiled on the amd64 runner (no emulation); building it here
  # catches a broken cross toolchain before a release does.
  docker-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
