name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The image a self-hoster pulls, run the way they would (#101):
  # scripts/container-smoke-test.sh. No secrets, so forks run it too.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tg-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/container-smoke-test.sh tg-mcp:ci

  # Both platforms in one build, as publish.yml and release.yml run it: the two
  # cross-compiles share one builder, which a single-platform job never shows.
  docker-multiarch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=multiarch
          cache-to: type=gha,mode=max,scope=multiarch

  # arm64 is cross-compiled on the amd64 runner (no emulation), as publish.yml
  # and release.yml build it; this job builds that image and hands it on.
  docker-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          tags: tg-mcp:ci-arm64
          outputs: type=docker,dest=${{ runner.temp }}/tg-mcp-arm64.tar
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
      - uses: actions/upload-artifact@v4
        with:
          name: tg-mcp-arm64
          path: ${{ runner.temp }}/tg-mcp-arm64.tar
          retention-days: 1

  # The arm64 image, run natively (Apple silicon's architecture) with the same
  # checks as the amd64 `docker` job (#131): proof it starts, not only builds.
  docker-arm64-smoke:
    needs: docker-arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tg-mcp-arm64
          path: ${{ runner.temp }}
      - run: docker load --input "$RUNNER_TEMP/tg-mcp-arm64.tar"
      - name: The image is arm64
        run: |
          arch="$(docker image inspect -f '{{.Architecture}}' tg-mcp:ci-arm64)"
          test "$arch" = arm64 || { echo "::error::tg-mcp:ci-arm64 is $arch, not arm64" >&2; exit 1; }
          test "$(uname -m)" = aarch64 || { echo "::error::runner is $(uname -m), not aarch64" >&2; exit 1; }
      - run: scripts/container-smoke-test.sh tg-mcp:ci-arm64
