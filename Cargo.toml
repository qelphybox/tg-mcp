[package]
name = "tg-mcp"
version = "0.1.3"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8"
base64 = "0.23.1"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
grammers-client = { version = "=0.11.0", default-features = false }
grammers-mtsender = "=0.11.0"
grammers-session = { version = "=0.11.0", default-features = false, features = ["serde"] }
grammers-tl-types = "=0.11.0"
hkdf = "0.13.0"
http = "1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rmcp = { version = "3.9.0", features = ["server", "transport-streamable-http-server", "macros", "elicitation"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite-bundled", "runtime-tokio", "migrate", "macros"] }
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tokio-util = "0.7.20"
tower-http = { version = "0.7.1", features = ["cors", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }
zeroize = "1.9.1"

[dev-dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
getrandom = "0.4.3"
jsonschema = { version = "0.60.2", default-features = false }
reqwest = { version = "0.13.5", default-features = false }
rmcp = { version = "3.9.0", features = ["client", "transport-streamable-http-client-reqwest"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "test-util"] }
tokio-util = "0.7.20"
url = "2.5.8"
