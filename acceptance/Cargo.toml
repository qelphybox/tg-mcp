[package]
name = "acceptance"
version = "0.0.0"
edition = "2024"
publish = false
description = "Acceptance against real Telegram on a Test account (ADR-0009)"

[[bin]]
name = "accept"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8"
base64 = "0.23.1"
getrandom = "0.4.3"
# rustls: the smoke scenario runs against production over HTTPS.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rmcp = { version = "3.9.0", features = ["client", "transport-streamable-http-client-reqwest"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
tg-mcp = { path = ".." }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time", "process"] }
tokio-util = "0.7.20"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
zeroize = "1.9.1"
grammers-client = { version = "=0.11.0", default-features = false }
grammers-mtsender = "=0.11.0"
grammers-session = { version = "=0.11.0", default-features = false }
