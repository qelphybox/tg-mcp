[package]
name = "acceptance"
version = "0.0.0"
edition = "2024"
publish = false
description = "Acceptance against real Telegram on a Test account (ADR-0009)"

[[bin]]
name = "accept"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8"
base64 = "0.23.1"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false }
rmcp = { version = "3.9.0", features = ["client", "transport-streamable-http-client-reqwest"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
tg-mcp = { path = ".." }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time"] }
tokio-util = "0.7.20"
url = "2.5.8"
zeroize = "1.9.1"
